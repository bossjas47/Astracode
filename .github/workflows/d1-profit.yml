# ชั่วคราว: คำนวณกำไร/รายได้ด้วย profitForecast จริงกับ D1 (อ่านอย่างเดียว: บล็อกทุกคำสั่งที่ไม่ใช่ SELECT) · ผลเข้ารหัสด้วย public key ก่อนพิมพ์ลง log
name: D1 profit report (one-off)
on:
  push:
    branches: [ccr-84ca511c-jo3r38]
    paths: ['.github/workflows/d1-profit.yml']
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compute and encrypt
        working-directory: astracode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > /tmp/pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvzZCqLmDmSUG9ww1FUMA
          oba5Ii5XsOvEgphdPzaDt+9Z1/E+3fC/P+uOn3LfsklSMIz93c2N25jGovFKwzgX
          iRcjYWCOfdyAIlds7s2Zpv7lGbP+DTse4vBDfC5fim6KnigQficP6j2swQ8hXpUm
          w/8s+jyixDJiQFt2z5xYR+OtxVeWy77x9W1DghMKCYs67YXxRiEam45HkpS3rgk5
          BXfrDqt60wTD7gQoDHlTB2rmGgiIt65sx/neWA9PhJkFcSAfrRv4S21At7+sWQ2V
          rfUFOgeW4sQ85Aty3TFv1PUtUUsep3gLkLXYS6h4M2W+4h2HrfygGSBIeVg5RCPe
          hXFYBblKaq12S3L3Haoic6OEVAOQ0sP48WdRwvEJggFzZFJoh9OCgaGK+RTE1+yK
          5ffR5SWuWkwbpWBWm+oE7g7p9noallA3hxn684JPOAohZZot9o66gaHHK2l/yWTa
          J99SkZgnwJC2cAGDd7N5TC8tTIW8UB4GTfofAISDNj5NAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          cat > /tmp/run.mjs <<'JS'
          import { writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const DBID = '723ec871-4ab3-48be-804e-7ef04e90564f', URL_ = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${DBID}/query`;
          let n = 0;
          const q = async (sql, params) => {
            if (!/^\s*(SELECT|WITH)\b/i.test(sql)) throw new Error('blocked non-read SQL: ' + sql.slice(0, 80));
            n++; const r = await fetch(URL_, { method: 'POST', headers: { authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, 'content-type': 'application/json' }, body: JSON.stringify({ sql, params }) });
            const d = await r.json(); if (!d.success) throw new Error(JSON.stringify(d.errors).slice(0, 300)); return d.result[0];
          };
          class St { constructor(s) { this.sql = s; this.p = []; } bind(...a) { this.p = a.map(x => x === undefined ? null : x); return this; }
            async first(c) { const r = (await q(this.sql, this.p)).results[0] ?? null; return c && r ? r[c] : r; }
            async all() { return { results: (await q(this.sql, this.p)).results, success: true }; }
            async run() { throw new Error('blocked write: ' + this.sql.slice(0, 80)); } }
          const env = { DB: { prepare: s => new St(s), batch: async () => { throw new Error('blocked batch'); } } };
          const { profitForecast } = await import(pathToFileURL(process.cwd() + '/src/admin.js').href);
          const out = {};
          try { const f = await profitForecast(env); out.forecast = { ...f, people: f.people.map(({ email, ...p }) => ({ ...p, email: String(email).replace(/^(.{3}).*(@.*)$/, '$1***$2') })) }; }
          catch (e) { out.error = String(e.stack || e.message).slice(0, 1500); }
          out.queries = n;
          writeFileSync('/tmp/out.json', JSON.stringify(out));
          JS
          node /tmp/run.mjs
          K=$(openssl rand -hex 32)
          gzip -9 -c /tmp/out.json | openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:"$K" | base64 -w0 > /tmp/data.b64
          printf %s "$K" | openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep | base64 -w0 > /tmp/key.b64
          rm -f /tmp/out.json
          echo "KEY:$(cat /tmp/key.b64)"
          echo "DATA_BEGIN"; fold -w 3000 /tmp/data.b64; echo; echo "DATA_END"
