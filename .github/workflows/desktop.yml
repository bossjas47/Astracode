name: Build Desktop (Windows .exe)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Tests
        working-directory: desktop
        run: npm test
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # ยังไม่เซ็นรับรอง: Windows จะขึ้นคำเตือนตอนติดตั้ง
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AstraCode-Desktop-Setup
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AstraCode-Desktop-Setup
          path: out
      # ลิงก์ดาวน์โหลดบนเว็บ (/download/desktop) ชี้มาที่ไฟล์นี้ใน GitHub Release แท็ก desktop-latest (ชื่อไฟล์คงที่ ทับของเดิมทุกครั้ง)
      # latest.yml + blockmap = ให้แอปที่ติดตั้งแล้วอัปเดตตัวเอง (electron-updater อ่านจาก release เดียวกัน) · ต้องเพิ่ม version ใน package.json ทุกครั้งที่อยากให้เครื่องผู้ใช้อัปเดต
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title "AstraCode Desktop" --notes "ตัวติดตั้ง Windows ล่าสุด" --target "${{ github.sha }}"
          gh release upload desktop-latest out/AstraCode-Desktop-Setup.exe out/*.blockmap out/latest.yml --clobber
