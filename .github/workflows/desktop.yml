name: Build Desktop (Windows .exe)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Tests
        working-directory: desktop
        run: npm test
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # ยังไม่เซ็นรับรอง: Windows จะขึ้นคำเตือนตอนติดตั้ง
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AstraCode-Desktop-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AstraCode-Desktop-Setup
          path: out
      # ลิงก์ดาวน์โหลดบนเว็บ (/download/desktop) อ่านไฟล์นี้จาก R2
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          f=$(ls out/*.exe | head -1); echo "$f"
          npx --yes wrangler@4.162.0 r2 object put astracode/dl/AstraCode-Desktop-Setup.exe --file "$f" --content-type application/octet-stream --remote
