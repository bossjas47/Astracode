name: Build Desktop (Windows / Mac / Linux)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: dist, name: win, files: "desktop/dist/*.exe\ndesktop/dist/*.exe.blockmap\ndesktop/dist/latest.yml" }
          - { os: macos-latest, script: 'dist:mac', name: mac, files: "desktop/dist/*.dmg\ndesktop/dist/*.zip\ndesktop/dist/*.blockmap\ndesktop/dist/latest-mac.yml" }
          - { os: ubuntu-latest, script: 'dist:linux', name: linux, files: "desktop/dist/*.AppImage\ndesktop/dist/latest-linux.yml" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Tests
        working-directory: desktop
        run: npm test
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # ยังไม่เซ็นรับรอง: Windows/Mac จะขึ้นคำเตือนตอนติดตั้ง
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
  publish:
    needs: build
    if: ${{ !cancelled() }} # Mac/Linux พังก็ยังปล่อยตัวที่ build ได้
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # astra CLI (Agent ในเทอร์มินัล): ไฟล์ชุดเดียวกับแอป ต้องมี Node.js 20+ ในเครื่อง
      - name: Pack CLI
        run: |
          mkdir -p cli/astra && cp desktop/cli.js desktop/agent.js desktop/agenttools.js desktop/tools.js cli/astra/
          printf '{\n  "name": "astra-cli",\n  "private": true,\n  "bin": { "astra": "cli.js" }\n}\n' > cli/astra/package.json
          printf 'AstraCode Agent CLI\n\n1) ติดตั้ง Node.js 20+\n2) แตก zip แล้วรันในโฟลเดอร์ astra: npm link   (ได้คำสั่ง astra)\n3) ไปที่โฟลเดอร์โปรเจกต์ แล้วพิมพ์: astra "แก้บั๊ก..."   หรือ astra เฉยๆ เพื่อคุยต่อเนื่อง\n   ครั้งแรกจะถาม API key (สร้างที่ https://astracode.panderx.xyz/developers)\n   ตัวเลือก: --mode ask|edits|auto|plan  --model <ชื่อ>  --dir <โฟลเดอร์>\n' > cli/astra/README.txt
          (cd cli && zip -qr ../astra-cli.zip astra)
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true
      # ลิงก์ดาวน์โหลดบนเว็บ (/download/desktop?os=win|mac|linux) ชี้มาที่ไฟล์ใน GitHub Release แท็ก desktop-latest (ชื่อไฟล์คงที่ ทับของเดิมทุกครั้ง)
      # latest*.yml + blockmap = ให้แอปที่ติดตั้งแล้วอัปเดตตัวเอง (electron-updater) · ต้องเพิ่ม version ใน package.json ทุกครั้งที่อยากให้เครื่องผู้ใช้อัปเดต
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title "AstraCode Desktop" --notes "ตัวติดตั้งล่าสุด Windows / Mac / Linux" --target "${{ github.sha }}"
          gh release upload desktop-latest out/* astra-cli.zip --clobber
