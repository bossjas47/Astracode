# ชั่วคราว: อ่าน log เมื่อวาน+วันนี้จาก D1 (SELECT อย่างเดียว) · repo เป็นสาธารณะ ผลจึงเข้ารหัสด้วย public key ก่อนพิมพ์ลง log
name: D1 log check (one-off)
on:
  push:
    branches: [ccr-84ca511c-jo3r38]
    paths: ['.github/workflows/d1-fable-log.yml']
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query and encrypt
        working-directory: astracode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > /tmp/pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvzZCqLmDmSUG9ww1FUMA
          oba5Ii5XsOvEgphdPzaDt+9Z1/E+3fC/P+uOn3LfsklSMIz93c2N25jGovFKwzgX
          iRcjYWCOfdyAIlds7s2Zpv7lGbP+DTse4vBDfC5fim6KnigQficP6j2swQ8hXpUm
          w/8s+jyixDJiQFt2z5xYR+OtxVeWy77x9W1DghMKCYs67YXxRiEam45HkpS3rgk5
          BXfrDqt60wTD7gQoDHlTB2rmGgiIt65sx/neWA9PhJkFcSAfrRv4S21At7+sWQ2V
          rfUFOgeW4sQ85Aty3TFv1PUtUUsep3gLkLXYS6h4M2W+4h2HrfygGSBIeVg5RCPe
          hXFYBblKaq12S3L3Haoic6OEVAOQ0sP48WdRwvEJggFzZFJoh9OCgaGK+RTE1+yK
          5ffR5SWuWkwbpWBWm+oE7g7p9noallA3hxn684JPOAohZZot9o66gaHHK2l/yWTa
          J99SkZgnwJC2cAGDd7N5TC8tTIW8UB4GTfofAISDNj5NAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          cat > /tmp/q.mjs <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const A = 1795366800000, DEP = 1795504020000, WK = 1794934800000; // 23 พ.ย. 00:00 เวลาไทย · deploy CSP 24 พ.ย. 14:07 · 7 วันก่อน
          const F = "(SELECT id FROM models WHERE name LIKE '%Fable%')";
          const D = c => "date((" + c + "+25200000)/1000,'unixepoch')", H = c => "strftime('%Y-%m-%d %H:00',(" + c + "+25200000)/1000,'unixepoch')", T = c => "datetime((" + c + "+25200000)/1000,'unixepoch')";
          const Q = {
            fable_by_hour: "SELECT " + H('g.created_at') + " hour, m.name, COALESCE(g.src,'-') src, COUNT(*) n, ROUND(AVG(g.ttft)) ttft_ms, ROUND(SUM(g.cost),2) cost FROM usage g JOIN models m ON m.id=g.model_id WHERE g.model_id IN " + F + " AND g.created_at>=" + A + " GROUP BY 1,2,3 ORDER BY 1",
            fable_last_use: "SELECT m.id, m.name, m.active, (SELECT " + T('MAX(created_at)') + " FROM usage WHERE model_id=m.id) last_use, (SELECT COUNT(*) FROM usage WHERE model_id=m.id AND created_at>=" + WK + ") uses_7d FROM models m WHERE m.id IN " + F,
            fable_events: "SELECT " + T('created_at') + " bkk, kind, model_id, substr(detail,1,250) detail FROM events WHERE model_id IN " + F + " AND created_at>=" + A + " ORDER BY created_at DESC LIMIT 80",
            fable_answers_by_day: "SELECT " + D('a.created_at') + " day, a.model_id, CASE WHEN c.project_id IS NULL THEN 'chat' ELSE 'code' END mode, COUNT(*) n, SUM(length(COALESCE(a.thinking,''))>0) with_thinking, ROUND(AVG(a.tout)) avg_out FROM messages a JOIN chats c ON c.id=a.chat_id WHERE a.role='assistant' AND a.model_id IN " + F + " AND a.created_at>=" + A + " GROUP BY 1,2,3 ORDER BY 1",
            switched: "SELECT " + T('a.created_at') + " bkk, a.chat_id, q.model_id chose, a.model_id answered FROM messages a JOIN messages q ON q.id=(SELECT MAX(id) FROM messages WHERE chat_id=a.chat_id AND id<a.id AND role='user') WHERE a.role='assistant' AND q.model_id IN " + F + " AND a.model_id<>q.model_id AND a.created_at>=" + A,
            fallback_events: "SELECT " + T('created_at') + " bkk, model_id, detail FROM events WHERE kind='fallback' AND created_at>=" + A + " ORDER BY created_at DESC LIMIT 50",
            fable_api: "SELECT " + D('created_at') + " day, model, req_model, status, COUNT(*) n, MAX(substr(err,1,150)) err FROM api_log WHERE (model LIKE '%fable%' OR req_model LIKE '%fable%') AND created_at>=" + A + " GROUP BY 1,2,3,4",
            audit_models: "SELECT " + T('created_at') + " bkk, admin_email, action, substr(detail,1,200) detail FROM audit WHERE (action LIKE '%model%' OR detail LIKE '%Fable%') AND created_at>=" + WK + " ORDER BY created_at DESC LIMIT 40",
            errors_by_model: "SELECT " + D('e.created_at') + " day, COALESCE(m.name,'-') model, e.kind, COUNT(*) n, MAX(substr(e.detail,1,70)) sample FROM events e LEFT JOIN models m ON m.id=e.model_id WHERE e.kind IN ('error','refused','fallback') AND e.created_at>=" + A + " GROUP BY 1,2,3 ORDER BY n DESC LIMIT 60",
            usage_by_day: "SELECT " + D('g.created_at') + " day, COALESCE(m.name,'(other)') model, COUNT(*) n, COUNT(DISTINCT g.user_id) users, ROUND(SUM(g.cost),2) cost FROM usage g LEFT JOIN models m ON m.id=g.model_id WHERE g.created_at>=" + A + " GROUP BY 1,2 ORDER BY 1, n DESC",
            client_errors_after_deploy: "SELECT substr(detail,1,220) detail, COUNT(*) n, " + T('MAX(created_at)') + " last FROM events WHERE kind='client' AND created_at>=" + DEP + " GROUP BY substr(detail,1,120) ORDER BY n DESC LIMIT 40",
            client_errors_before: "SELECT COUNT(*) n FROM events WHERE kind='client' AND created_at BETWEEN " + (DEP - 86400000) + " AND " + DEP,
          };
          const out = {};
          for (const [k, sql] of Object.entries(Q)) {
            try { out[k] = JSON.parse(execFileSync('npx', ['--yes', 'wrangler@4.162.0', 'd1', 'execute', 'astracode', '--remote', '--json', '--command', sql], { encoding: 'utf8', maxBuffer: 64e6, stdio: ['ignore', 'pipe', 'pipe'] }))[0]?.results ?? null; console.log('ok', k, out[k]?.length); }
            catch (e) { out[k] = { error: String(e.stderr || e.message).slice(0, 2000) }; console.log('FAILED', k); }
          }
          writeFileSync('/tmp/out.json', JSON.stringify(out));
          JS
          node /tmp/q.mjs
          K=$(openssl rand -hex 32)
          gzip -9 -n -c /tmp/out.json > /tmp/out.gz; echo "SHA:$(sha256sum /tmp/out.gz | cut -c1-16)"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:"$K" -in /tmp/out.gz | base64 -w0 > /tmp/data.b64
          printf %s "$K" | openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep | base64 -w0 > /tmp/key.b64
          rm -f /tmp/out.json /tmp/out.gz
          echo "KEY:$(cat /tmp/key.b64)"
          echo "DATA_BEGIN"; fold -w 1000 /tmp/data.b64; echo; echo "DATA_END"
