name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['astracode/**', 'desktop/agent.js', 'desktop/agenttools.js', 'desktop/tools.js', 'desktop/localfs.js', 'desktop/android.js', 'desktop/office.js', 'desktop/skills.js', 'desktop/hub.js', 'desktop/plugmake.js']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        working-directory: astracode
        run: npm run lint
      - name: Tests
        working-directory: astracode
        run: npm test
      # Opens every page in the runner's own Chrome against a mocked API. It reports page errors but does not block
      # the deploy: a broken test environment must not stop a release.
      - name: Browser page test
        working-directory: astracode
        continue-on-error: true
        run: |
          npm install --no-save playwright-core
          CHROME_PATH="$(which google-chrome || which chromium-browser || which chromium)" npm run e2e
      # หน้าจอจริงก่อน deploy: Worker จริง + เบราว์เซอร์จริง · ธีมสว่าง/มืด × คอม/มือถือ · ตัวหนังสืออ่านไม่ได้ หรือ error ของ JavaScript = ไม่ deploy
      - name: UI check (blocks deploy)
        working-directory: astracode
        run: CHROME_PATH="$(which google-chrome || which chromium-browser || which chromium)" npm run uicheck
      - name: UI check screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uicheck
          path: astracode/tests/uicheck-out
      # wrangler uploads the Worker, then fails reading the workers.dev subdomain because the token
      # lacks that permission. The next step decides success by asking the live site which version runs.
      - uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          wranglerVersion: '4.162.0' # wrangler 3 ข้ามค่า run_worker_first ทำให้ Worker ไม่ทำงานกับหน้าเว็บ
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: astracode
          command: deploy --keep-vars --var VERSION:${{ github.sha }}
      - name: Verify live version
        run: |
          for i in $(seq 1 12); do
            v=$(curl -fsS https://astracode.panderx.xyz/api/version || true)
            echo "$v"
            case "$v" in *"${{ github.sha }}"*) exit 0;; esac
            sleep 10
          done
          echo "Live site is not running ${{ github.sha }}" >&2
          exit 1
      # Agent บนคลาวด์: deploy ซ้ำพร้อมเครื่องเสมือน (Cloudflare Containers) · พัง = เว็บหลักยังเป็นเวอร์ชันที่ตรวจแล้วข้างบน แค่ไม่มี AGENTBOX (API ตอบ 503)
      - name: Prepare cloud agent image
        run: |
          mkdir -p astracode/container/app
          cp desktop/agent.js desktop/agenttools.js desktop/tools.js desktop/localfs.js desktop/android.js desktop/office.js desktop/skills.js desktop/hub.js desktop/plugmake.js astracode/container/app/
          cat astracode/wrangler.toml astracode/wrangler.cloud.extra.toml > astracode/wrangler.cloud.toml
      - uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          wranglerVersion: '4.162.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: astracode
          command: deploy --config wrangler.cloud.toml --keep-vars --var VERSION:${{ github.sha }}
      - name: Smoke test
        env:
          KEY: ${{ secrets.ASTRA_TEST_KEY }}
        run: |
          B=https://astracode.panderx.xyz; fail=0
          for p in / /chat /code /plans /pricing /developers /api/settings/public /api/plans /api/pricing /api/status /sitemap.xml; do
            c=$(curl -sSL --max-redirs 3 -o /dev/null -w '%{http_code}' "$B$p"); echo "$c $p"; [ "$c" = 200 ] || fail=1 # -L: หน้าเว็บที่โดเมนเดิมย้ายไปโดเมนใหม่ (301) · /api และ /v1 ไม่ย้าย
          done
          c=$(curl -sS -o /dev/null -w '%{http_code}' "$B/v1/models"); echo "$c /v1/models (no key)"; [ "$c" = 401 ] || fail=1
          if [ -n "$KEY" ]; then # optional: a real API key with a small budget, set as the ASTRA_TEST_KEY secret
            c=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $KEY" "$B/v1/models"); echo "$c /v1/models (key)"; [ "$c" = 200 ] || fail=1
          fi
          exit $fail
