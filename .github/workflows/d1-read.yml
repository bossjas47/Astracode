# ชั่วคราว (อ่านอย่างเดียว · ผู้ใช้อนุญาตแล้ว): ตรวจรายได้แพลนเฉลี่ยตามวันใช้งาน ตัวเลขรวมเท่านั้น (ไม่ดึงอีเมล) แล้วลบ workflow นี้ทิ้ง
name: D1 read revenue check (one-off)
on:
  push:
    branches: [ccr-84ca511c-jo3r38]
    paths: ['.github/workflows/d1-read.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read
        working-directory: astracode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() { echo "## $1"; npx --yes wrangler@4.162.0 d1 execute astracode --remote --json --command "$2" | grep -v '"meta"' | tr -d '\n' | sed 's/},{/}\n{/g; s/"success".*//'; echo; echo ---; }
          NR="user_id NOT IN (SELECT id FROM users WHERE no_report=1 OR role<>'user')"
          F="((CAST((strftime('%s','now')*1000+25200000)/86400000 AS INTEGER)-13)*86400000-25200000)"
          D="date(CAST((X+25200000)/86400000 AS INTEGER)*86400,'unixepoch')"
          dd() { echo "${D//X/$1}"; }
          A="COALESCE(approved_at,created_at)"
          q plan_prorated "SELECT pl.name, p.period, (CASE WHEN p.period='year' THEN 365.0 ELSE COALESCE(NULLIF(pl.days,0),30)*1.0 END) days, COUNT(*) n, SUM(p.amount) sold, ROUND(SUM(p.amount*MIN(((strftime('%s','now')*1000-COALESCE(p.approved_at,p.created_at))/86400000.0),(CASE WHEN p.period='year' THEN 365.0 ELSE COALESCE(NULLIF(pl.days,0),30)*1.0 END))/(CASE WHEN p.period='year' THEN 365.0 ELSE COALESCE(NULLIF(pl.days,0),30)*1.0 END)),2) used_so_far, ROUND(SUM(CASE WHEN ((strftime('%s','now')*1000-COALESCE(p.approved_at,p.created_at))/86400000.0)<(CASE WHEN p.period='year' THEN 365.0 ELSE COALESCE(NULLIF(pl.days,0),30)*1.0 END) THEN p.amount/(CASE WHEN p.period='year' THEN 365.0 ELSE COALESCE(NULLIF(pl.days,0),30)*1.0 END) ELSE 0 END),2) per_day_now FROM payments p LEFT JOIN plans pl ON pl.id=p.plan_id WHERE p.kind='plan' AND p.status='approved' AND p.user_id NOT IN (SELECT id FROM users WHERE no_report=1 OR role<>'user') AND COALESCE(p.approved_at,p.created_at)>=$F GROUP BY pl.name, p.period, days ORDER BY sold DESC"
          q older_active "SELECT COUNT(*) n, ROUND(SUM(p.amount/(CASE WHEN p.period='year' THEN 365.0 ELSE COALESCE(NULLIF(pl.days,0),30)*1.0 END)),2) per_day_now FROM payments p LEFT JOIN plans pl ON pl.id=p.plan_id WHERE p.kind='plan' AND p.status='approved' AND p.user_id NOT IN (SELECT id FROM users WHERE no_report=1 OR role<>'user') AND COALESCE(p.approved_at,p.created_at)<$F AND ((strftime('%s','now')*1000-COALESCE(p.approved_at,p.created_at))/86400000.0)<(CASE WHEN p.period='year' THEN 365.0 ELSE COALESCE(NULLIF(pl.days,0),30)*1.0 END)"
