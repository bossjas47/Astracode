# ชั่วคราว (อ่านอย่างเดียว): ดูรายการโมเดล Claude ทั้งหมด (มี/ไม่มี Eco) สถานะ ราคา และแพลนที่ใส่ไว้ แล้วลบ workflow นี้ทิ้ง · ไม่อ่าน key
name: D1 read Claude models (one-off)
on:
  push:
    branches: [ccr-84ca511c-jo3r38]
    paths: ['.github/workflows/d1-read.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read
        working-directory: astracode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --json --command "SELECT id, name, provider, api_model, active, public, multiplier, cost_in, cost_out, cost_cache, key_name, fallback_id FROM models WHERE name LIKE '%Claude%' OR api_model LIKE '%claude%' OR api_model LIKE '%opus%' OR api_model LIKE '%sonnet%' ORDER BY id" | grep -v '"meta"' | tr -d '\n' | sed 's/},{/}\n{/g'
          echo; echo PLANS
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --json --command "SELECT pm.plan_id, p.name plan, pm.model_id FROM plan_models pm JOIN plans p ON p.id=pm.plan_id JOIN models m ON m.id=pm.model_id WHERE m.name LIKE '%Claude%' ORDER BY pm.plan_id, pm.model_id" | grep -v '"meta"' | tr -d '\n' | sed 's/},{/}\n{/g'
