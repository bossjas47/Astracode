# ชั่วคราว (อ่านอย่างเดียว · ผู้ใช้อนุญาตแล้ว): ตรวจรายได้/ต้นทุน/กำไร 14 วัน ตัวเลขรวมเท่านั้น (ไม่ดึงอีเมล) แล้วลบ workflow นี้ทิ้ง
name: D1 read revenue check (one-off)
on:
  push:
    branches: [ccr-84ca511c-jo3r38]
    paths: ['.github/workflows/d1-read.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read
        working-directory: astracode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() { echo "## $1"; npx --yes wrangler@4.162.0 d1 execute astracode --remote --json --command "$2" | grep -v '"meta"' | tr -d '\n' | sed 's/},{/}\n{/g; s/"success".*//'; echo; echo ---; }
          NR="user_id NOT IN (SELECT id FROM users WHERE no_report=1 OR role<>'user')"
          F="((CAST((strftime('%s','now')*1000+25200000)/86400000 AS INTEGER)-13)*86400000-25200000)"
          D="date(CAST((X+25200000)/86400000 AS INTEGER)*86400,'unixepoch')"
          dd() { echo "${D//X/$1}"; }
          A="COALESCE(approved_at,created_at)"
          q plan_by_day "SELECT $(dd "$A") d, COUNT(*) n, SUM(amount) v, SUM(CASE WHEN slip_key='wallet' THEN amount ELSE 0 END) via_wallet, SUM(CASE WHEN slip_key='coupon' THEN amount ELSE 0 END) via_coupon FROM payments WHERE kind='plan' AND status='approved' AND $NR AND $A>=$F GROUP BY d ORDER BY d"
          q cash_by_day "SELECT $(dd "$A") d, kind, COUNT(*) n, SUM(amount) v FROM payments WHERE status='approved' AND $NR AND kind IN ('plan','topup') AND COALESCE(slip_key,'') NOT IN ('wallet','coupon') AND $A>=$F GROUP BY d, kind ORDER BY d"
          q wallet_kinds_by_day "SELECT $(dd created_at) d, kind, COUNT(*) n, ROUND(SUM(amount),2) v FROM wallet_tx WHERE $NR AND created_at>=$F GROUP BY d, kind ORDER BY d, kind"
          q cost_by_day "SELECT $(dd created_at) d, COUNT(*) n, ROUND(SUM(cost),2) cost, ROUND(SUM(CASE WHEN units>0 THEN cost END),2) plan_cost, ROUND(SUM(CASE WHEN units=0 THEN cost END),2) wallet_api_cost, ROUND(SUM(charge),2) charged FROM usage WHERE created_at>=$F AND $NR GROUP BY d ORDER BY d"
          q excluded_cost "SELECT ROUND(SUM(cost),2) cost, COUNT(DISTINCT user_id) users FROM usage WHERE created_at>=$F AND NOT ($NR)"
          q cost_by_key "SELECT COALESCE(m.key_name,'?') k, COUNT(*) n, ROUND(SUM(g.cost),2) cost, SUM(g.tokens_in) tin, SUM(g.tokens_cache) tcache, SUM(g.tokens_out) tout FROM usage g LEFT JOIN models m ON m.id=g.model_id WHERE g.created_at>=$F GROUP BY k ORDER BY cost DESC"
          q cost_by_model "SELECT g.model_id id, m.name, m.key_name k, COUNT(*) n, ROUND(SUM(g.cost),2) cost, SUM(g.tokens_in) tin, SUM(g.tokens_cache) tcache, SUM(g.tokens_out) tout FROM usage g LEFT JOIN models m ON m.id=g.model_id WHERE g.created_at>=$F GROUP BY g.model_id ORDER BY cost DESC LIMIT 25"
          q cost_by_src "SELECT COALESCE(src,'chat') src, COUNT(*) n, ROUND(SUM(cost),2) cost FROM usage WHERE created_at>=$F GROUP BY src ORDER BY cost DESC"
          q anomalies "SELECT SUM(cost<0) neg_cost, SUM(cost=0 AND model_id>0 AND (tokens_in+tokens_out)>0) zero_cost_tokens, ROUND(SUM(CASE WHEN cost=0 AND model_id>0 AND (tokens_in+tokens_out)>0 THEN tokens_in+tokens_out END),0) zero_cost_tok, SUM(flag='est') est, SUM(flag='part') part, SUM(flag='gone') gone, SUM(model_id<=0) no_model, ROUND(SUM(CASE WHEN model_id<=0 THEN cost END),2) no_model_cost FROM usage WHERE created_at>=$F"
          q zero_cost_models "SELECT g.model_id, m.name, m.cost_in, m.cost_out, COUNT(*) n, SUM(g.tokens_in+g.tokens_out) tok FROM usage g LEFT JOIN models m ON m.id=g.model_id WHERE g.created_at>=$F AND g.cost=0 AND g.model_id>0 AND (g.tokens_in+g.tokens_out)>0 GROUP BY g.model_id ORDER BY tok DESC LIMIT 10"
          q dup_slips "SELECT COUNT(*) groups, SUM(c) rows FROM (SELECT slip_ref, COUNT(*) c FROM payments WHERE status='approved' AND slip_ref IS NOT NULL AND slip_ref<>'' GROUP BY slip_ref HAVING c>1)"
          q dup_slips_recent "SELECT p.id, p.kind, p.amount, $(dd "COALESCE(p.approved_at,p.created_at)") d, p.user_id % 997 who FROM payments p WHERE p.status='approved' AND p.slip_ref IN (SELECT slip_ref FROM payments WHERE status='approved' AND slip_ref IS NOT NULL AND slip_ref<>'' GROUP BY slip_ref HAVING COUNT(*)>1) ORDER BY p.id DESC LIMIT 12"
          q payment_kinds "SELECT kind, status, CASE WHEN slip_key IN ('wallet','coupon') THEN slip_key ELSE 'slip' END via, COUNT(*) n, SUM(amount) v FROM payments WHERE created_at>=$F GROUP BY kind, status, via"
          q slip_mismatch "SELECT COUNT(*) n, ROUND(SUM(amount-slip_amount),2) diff FROM payments WHERE status='approved' AND slip_amount IS NOT NULL AND ABS(amount-slip_amount)>0.5 AND $A>=$F"
          q multi_plan "SELECT COUNT(*) users, SUM(c) subs FROM (SELECT user_id, COUNT(*) c FROM subscriptions WHERE status='active' AND expires_at>strftime('%s','now')*1000 GROUP BY user_id HAVING c>1)"
          q wallet_liability "SELECT ROUND(SUM(balance),2) bal, COUNT(*) n FROM users WHERE balance>0 AND COALESCE(no_report,0)=0 AND role='user'"
          q key_funds "SELECT value FROM settings WHERE key='key_funds'"
