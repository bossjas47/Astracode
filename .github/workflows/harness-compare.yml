# ชั่วคราว: เทียบ DeepSeek 4.1 Flash ไม่มี/มี Kyber Harness (สร้าง landing page) แล้วเก็บผลลง branch harness-compare-results · ลบหลังใช้
name: Harness compare (temporary)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/harness-compare.yml']
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Run comparison
        env:
          KYBER_EVAL_KEY: ${{ secrets.KYBER_EVAL_KEY }}
        run: node .github/harness-compare/run.cjs
      - name: Save results to branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r out/. /tmp/res/ 2>/dev/null || true
          git config user.name "kyber-bot" && git config user.email "bot@users.noreply.github.com"
          git checkout --orphan harness-compare-results && git rm -rf -q . && cp -r /tmp/res/. . && git add -A && git commit -q -m "harness compare results" && git push -f origin harness-compare-results
