# ชั่วคราว: คืนค่า Claude Haiku 5.5 เป็นแบบเดิม (key HAIKU5.5 + ราคาต้นทุนเดิม) และเปิดใช้ แล้วลบ workflow นี้ทิ้ง · ไม่อ่าน key
name: D1 set Claude non-Eco costs (one-off)
on:
  push:
    branches: [ccr-84ca511c-jo3r38]
    paths: ['.github/workflows/d1-set.yml']
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set and verify
        working-directory: astracode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --command "UPDATE models SET key_name='HAIKU5.5', cost_in=0.5167, cost_out=2.58, cost_cache=0.057, active=1 WHERE id=12 AND api_model='claude-haiku-5-5'" > /dev/null
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --json --command "SELECT id, name, active, public, multiplier, cost_in, cost_out, cost_cache, cost_cache_write, key_name, fallback_id FROM models WHERE id=12" | grep -v '"meta"' | tr -d '\n'
