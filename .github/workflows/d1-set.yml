# ชั่วคราว: ตั้งค่า turnstile_site (Turnstile site key = ค่าสาธารณะ) ในตาราง settings แล้วลบ workflow นี้ทิ้ง
name: D1 set turnstile site key (one-off)
on:
  push:
    branches: [ccr-84ca511c-jo3r38]
    paths: ['.github/workflows/d1-set.yml']
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set and verify
        working-directory: astracode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --command "INSERT OR REPLACE INTO settings (key,value) VALUES ('turnstile_site','0x4AAAAAAGRrJeykr8Nmp__U')" > /dev/null
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --json --command "SELECT key, value FROM settings WHERE key='turnstile_site'" | grep -o '"value": *"[^"]*"'
