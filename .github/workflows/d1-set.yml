# ชั่วคราว: แก้ราคาต้นทุน Claude Opus 5.5 / Haiku 5.5 (ผู้ให้บริการ Claude Cursor Ultra) และเปิดใช้ แล้วลบ workflow นี้ทิ้ง · ไม่อ่าน key
name: D1 set Claude non-Eco costs (one-off)
on:
  push:
    branches: [ccr-84ca511c-jo3r38]
    paths: ['.github/workflows/d1-set.yml']
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set and verify
        working-directory: astracode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --command "UPDATE models SET cost_in=12.84, cost_out=64.19, cost_cache=0.6419, cost_cache_write=16.05, active=1 WHERE id=15 AND api_model='claude-opus-5-5'" > /dev/null
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --command "UPDATE models SET cost_in=0.321, cost_out=1.6, cost_cache=0.0321, cost_cache_write=0.4012, key_name='CLAUDE_ULTRA_KEY', active=1 WHERE id=12 AND api_model='claude-haiku-5-5'" > /dev/null
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --json --command "SELECT id, name, active, public, multiplier, cost_in, cost_out, cost_cache, cost_cache_write, key_name FROM models WHERE id IN (12,13,15,16) ORDER BY id" | grep -v '"meta"' | tr -d '\n' | sed 's/},{/}\n{/g'
