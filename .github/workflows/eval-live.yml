# Live Eval ของ Kyber Harness: ให้โมเดลจริงทำงานจริง 5 งานผ่าน /v1 ทุกสัปดาห์ แล้วสรุปอัตราผ่านต่อโมเดลไว้ในหน้าผลของ workflow
# ต้องตั้ง secret KYBER_EVAL_KEY (API key ของ Kyber ที่มีเครดิต · ใช้เงินจริงตามจำนวน token) · ไม่ได้ตั้ง = ข้ามโดยไม่ล้ม
# เลือกโมเดลได้ที่ Settings → Variables → KYBER_EVAL_MODELS (คั่นด้วย ,) หรือตอนกด Run workflow · ไม่ระบุ = 3 โมเดลแรกจาก /v1/models
name: Live eval (Kyber Harness)
on:
  schedule:
    - cron: '43 2 * * 1' # ทุกวันจันทร์ 09:43 น. เวลาไทย
  workflow_dispatch:
    inputs:
      models:
        description: 'ชื่อโมเดลคั่นด้วย , (เว้นว่าง = ใช้ค่าที่ตั้งไว้)'
        required: false
      cases:
        description: 'ชื่องานคั่นด้วยเว้นวรรค (เว้นว่าง = ทุกงาน)'
        required: false
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live eval
        working-directory: astracode
        env:
          KYBER_EVAL_KEY: ${{ secrets.KYBER_EVAL_KEY }}
          KYBER_EVAL_MODELS: ${{ github.event.inputs.models || vars.KYBER_EVAL_MODELS }}
          CASES: ${{ github.event.inputs.cases }}
        run: node tests/bench/live-eval.mjs $CASES
      - name: Save results for the admin quality page
        if: always()
        working-directory: astracode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -f live-eval.json ] || { echo "no results"; exit 0; }
          node -e "const d=require('./live-eval.json');const j=JSON.stringify({by:d.by,rows:d.rows.map(r=>({case:r.case,model:r.model,pass:r.pass,rounds:r.rounds,ms:r.ms,charge:r.charge,stuck:r.stuck}))}).replace(/'/g,\"''\");require('fs').writeFileSync('eval.sql','CREATE TABLE IF NOT EXISTS eval_runs (id INTEGER PRIMARY KEY AUTOINCREMENT, at INTEGER NOT NULL, data TEXT NOT NULL);\nINSERT INTO eval_runs (at,data) VALUES ('+d.at+','+\"'\"+j+\"'\"+');\n')"
          npx --yes wrangler@4.162.0 d1 execute astracode --remote --file eval.sql
