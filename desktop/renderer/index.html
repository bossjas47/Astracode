<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<title>AstraCode Desktop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b class="logo">AstraCode Desktop</b>
  <button id="folder" class="chip" title="โฟลเดอร์ที่ AI ทำงานได้">📁 เลือกโฟลเดอร์งาน</button>
  <select id="model" title="โมเดล"></select>
  <span class="sp"></span><span id="usage" class="muted"></span>
  <button id="newchat" class="chip">งานใหม่</button>
  <button id="gear" class="chip" title="ตั้งค่า">⚙ ตั้งค่า</button>
</header>
<main id="log"><div class="hello" id="hello">
  <h1>💻 ทำงานในเครื่อง</h1>
  <p>1. กด <b>เข้าสู่ระบบ</b> &nbsp; 2. เลือก <b>โฟลเดอร์งาน</b> &nbsp; 3. พิมพ์สั่งงาน เช่น “สร้างเว็บหน้าแรกเป็นไฟล์ index.html” หรือ “สร้างโต๊ะไม้ใน Blender”</p>
  <button id="login" class="btn">เข้าสู่ระบบด้วยบัญชี AstraCode</button>
</div></main>
<form id="f"><textarea id="t" rows="2" placeholder="สั่งงาน… (Enter ส่ง, Shift+Enter ขึ้นบรรทัดใหม่)"></textarea><button id="go" class="btn">ส่ง</button></form>
<dialog id="dlg"><form method="dialog" id="setf">
  <h3>ตั้งค่า</h3>
  <label>API Key (เว้นว่าง = ใช้ที่ได้จากการเข้าสู่ระบบ)</label><input id="key" placeholder="sk-astra-…">
  <label class="row"><input type="checkbox" id="autoWrite"> แก้ไฟล์ได้เลยโดยไม่ต้องถาม</label>
  <label class="row"><input type="checkbox" id="autoRun"> รันคำสั่งได้เลยโดยไม่ต้องถาม (เสี่ยง)</label>
  <label>MCP servers (JSON) เช่น Blender</label>
  <textarea id="mcp" rows="7" spellcheck="false" placeholder='{ "mcpServers": { "blender": { "command": "uvx", "args": ["blender-mcp"] } } }'></textarea>
  <div class="row end"><button value="cancel" class="chip">ยกเลิก</button><button id="savebtn" value="save" class="btn">บันทึก</button></div>
</form></dialog>
<dialog id="ask"><h3>AI ขออนุญาต</h3><pre id="askt"></pre><div class="row end"><button id="no" class="chip">ไม่อนุญาต</button><button id="yes" class="btn">อนุญาต</button></div></dialog>
<script src="renderer.js"></script>
</body>
</html>
