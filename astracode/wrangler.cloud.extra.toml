
# ---- ต่อท้าย wrangler.toml ตอน deploy รอบสอง (workflow สร้าง wrangler.cloud.toml) ----
# Agent บนคลาวด์: Durable Object AgentBox คุมเครื่องเสมือน 1 เครื่องต่องาน (image จาก container/Dockerfile)
[[durable_objects.bindings]]
name = "AGENTBOX"
class_name = "AgentBox"

[[containers]]
class_name = "AgentBox"
image = "./container/Dockerfile"
max_instances = 20 # Kyber Harness (cw_running ค่าเริ่มต้น 15) + Agent บนคลาวด์ + Python รวมกัน · จ่ายตามเวลาที่เครื่องเปิดจริง
instance_type = "standard-1" # Cowork: Chromium + Python ต้องใช้หน่วยความจำมากกว่า basic
