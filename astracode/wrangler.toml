name = "astracode"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Workers Paid ($5): CPU ต่อคำขอได้ถึง 5 นาที (แผนฟรี 10ms) · แตก zip ใหญ่, ย่อแชต, ตรวจสลิป, งาน cron ไม่โดนตัดกลางทาง
[limits]
cpu_ms = 300000

# Workers Logs: เก็บ log ทุกคำขอ ค้น error ย้อนหลังได้ใน dashboard (Workers Paid ได้ 20 ล้านบรรทัด/เดือน)
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./public"
binding = "ASSETS"
# ให้ worker ทำงานก่อนทุกไฟล์ (security headers + เลขเวอร์ชันไฟล์ JS/CSS)
# ห้ามยกเว้นด้วยนามสกุล เช่น "!/*.png": กฎนี้จับทุกระดับโฟลเดอร์ รวมรูปที่ AI สร้าง /api/img/.../x.png ทำให้ขึ้น 404
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "astracode"
database_id = "723ec871-4ab3-48be-804e-7ef04e90564f"   # ได้จาก: npx wrangler d1 create astracode

[[r2_buckets]] # เก็บรูปที่ AI สร้างและสลิป (ไม่ผูกก็ได้: ระบบจะเก็บใน D1 แทน)
binding = "SLIPS"
bucket_name = "astracode"

# [vars]  (ตั้ง ADMIN_EMAIL ใน dashboard ของ Worker แทน จะได้ไม่ถูกเขียนทับตอน deploy)

# ตอบแชตต่อเบื้องหลังแม้ผู้ใช้ปิดจอ (Durable Object แบบ SQLite)
[[durable_objects.bindings]]
name = "CHATRUN"
class_name = "ChatRun"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRun"]

[triggers]
crons = ["0 * * * *"]   # ทุกชั่วโมง: ต่ออายุจาก Wallet, เตือนหมดอายุ, แจ้งต้นทุน, backup ตี 3, ล้างข้อมูลเก่า
